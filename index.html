<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess-Board</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="banner"><img src="./images/chess (2).svg" alt="chess-banner"></div>
    <h1 class="caption">Chess-Board</h1>
    <table>
      
      <!-- row1 -->
      <tr id="black-icon">
        <td class="empty">8</td>
        <td class="dark">&#x265C;</td>
        <td class="light">&#x265E;</td>
        <td class="dark">&#x265D;</td>
        <td class="light">&#x265B;</td>
        <td class="dark">&#x265A;</td>
        <td class="light">&#x265D;</td>
        <td class="dark">&#x265E;</td>
        <td class="light">&#x265C;</td>
      </tr>
      <!-- row2 -->
      <tr id="black-icon">
        <td class="empty">7</td>
        <td class="light">&#x265F;</td>
        <td class="dark">&#x265F;</td>
        <td class="light">&#x265F;</td>
        <td class="dark">&#x265F;</td>
        <td class="light">&#x265F;</td>
        <td class="dark">&#x265F;</td>
        <td class="light">&#x265F;</td>
        <td class="dark">&#x265F;</td>
      </tr>
      <!-- row 3 -->
      <tr>
        <td class="empty">6</td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
      </tr>
      <!-- row 4 -->
      <tr>
        <td class="empty">5</td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
      </tr>
      <!-- row 5 -->
      <tr>
        <td class="empty">4</td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
      </tr>
      <!-- row 6 -->
      <tr>
        <td class="empty">3</td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
      </tr>
      <!-- row 7 -->
      <tr id="white-icon">
        <td class="empty">2</td>
        <td class="dark">&#x2659;</td>
        <td class="light">&#x2659;</td>
        <td class="dark">&#x2659;</td>
        <td class="light">&#x2659;</td>
        <td class="dark">&#x2659;</td>
        <td class="light">&#x2659;</td>
        <td class="dark">&#x2659;</td>
        <td class="light">&#x2659;</td>
      </tr>

      <!-- row 8 -->
      <tr id="white-icon">
        <td class="empty">1</td>
        <td class="light">&#x2656;</td>
        <td class="dark">&#x2658;</td>
        <td class="light">&#x2657;</td>
        <td class="dark">&#x2655;</td>
        <td class="light">&#x2654;</td>
        <td class="dark">&#x2657;</td>
        <td class="light">&#x2658;</td>
        <td class="dark">&#x2659;</td>
      </tr>
      <!-- empty row -->
      <tr>
        <td class="important"></td>
        <td class="empty">a</td>
        <td class="empty">b</td>
        <td class="empty">c</td>
        <td class="empty">d</td>
        <td class="empty">e</td>
        <td class="empty">f</td>
        <td class="empty">g</td>
        <td class="empty">h</td>
      </tr>
    </table>
  </body>
</html>
